<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 232" width="490" height="232" role="img" aria-label="jpass, live. AI agents sign in and store keys for me without ever seeing a password."><title>jpass, live. AI agents sign in and store keys for me without ever seeing a password.</title><style>@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
