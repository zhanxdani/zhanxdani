<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 232" width="490" height="232" role="img" aria-label="220+ end-to-end tests guarding every change"><title>220+ end-to-end tests guarding every change</title><style>@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
@keyframes ping{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes nudge{0%,60%,100%{transform:none}80%{transform:translate(3px,-3px)}}
.up{animation:up .9s cubic-bezier(.23,1,.32,1) both}
.fade{animation:fade 1.2s ease both}
.rise{animation:rise 1.6s cubic-bezier(.23,1,.32,1) both}
.draw{stroke-dasharray:1;animation:draw 2.2s cubic-bezier(.23,1,.32,1) both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.23,1,.32,1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.twinkle{animation:twinkle 3.6s ease-in-out infinite}
.nudge{transform-box:fill-box;animation:nudge 3.2s ease-in-out infinite}
