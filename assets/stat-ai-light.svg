<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 232" width="490" height="232" role="img" aria-label="72% of commits written by AI agents"><title>72% of commits written by AI agents</title><style>@keyframes up{from{opacity:0;transform:translateY(14px)}}
