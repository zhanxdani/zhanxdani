<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 232" width="490" height="232" role="img" aria-label="Efirio, idea. A voice assistant for creators that sees through the camera and plans scripts."><title>Efirio, idea. A voice assistant for creators that sees through the camera and plans scripts.</title><style>@keyframes up{from{opacity:0;transform:translateY(14px)}}
