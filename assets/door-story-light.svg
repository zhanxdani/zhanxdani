<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 232" width="490" height="232" role="img" aria-label="Story &amp; roadmap. Why we do this, what's next"><title>Story &amp; roadmap. Why we do this, what's next</title><style>@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
